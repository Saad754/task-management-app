<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title mb-4">Create an account</h4>

        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" [(ngModel)]="username" />
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" [(ngModel)]="password" />
        </div>

        <button class="btn btn-primary w-100" (click)="onRegister()">Register</button>

        @if (error()) {
        <div class="alert alert-danger mt-3 mb-0">{{ error() }}</div>
        }

        <p class="text-center text-muted mt-3 mb-0">
          Already have an account? <a routerLink="/login">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
