<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="mb-0">My Tasks</h3>
  <div>
    <a routerLink="/task-form" class="btn btn-primary me-2">New Task</a>
    <button class="btn btn-outline-secondary" (click)="onLogout()">Log out</button>
  </div>
</div>

<div class="card shadow-sm mb-4">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-sm-6">
        <label class="form-label">Status</label>
        <select class="form-select" [(ngModel)]="statusFilter" (ngModelChange)="onStatusChange()">
          <option value="">All</option>
          <option value="TODO">TODO</option>
          <option value="IN_PROGRESS">IN_PROGRESS</option>
          <option value="DONE">DONE</option>
        </select>
      </div>
      <div class="col-sm-6">
        <label class="form-label">Priority</label>
        <select class="form-select" [(ngModel)]="priorityFilter" (ngModelChange)="onPriorityChange()">
          <option value="">All</option>
          <option value="LOW">LOW</option>
          <option value="MEDIUM">MEDIUM</option>
          <option value="HIGH">HIGH</option>
        </select>
      </div>
    </div>
  </div>
</div>

@if (error()) {
<div class="alert alert-danger">{{ error() }}</div>
}

<div class="card shadow-sm">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light">
    <tr>
      <th>Task</th>
      <th>Status</th>
      <th>Priority</th>
      <th class="text-end">Actions</th>
    </tr>
    </thead>
    <tbody>
    @for (task of tasks(); track task.id) {
    <tr>
      <td>
        <div class="fw-semibold">{{ task.title }}</div>
        @if (task.description) {
        <small class="text-muted">{{ task.description }}</small>
        }
      </td>
      <td><span class="badge text-bg-secondary">{{ task.status }}</span></td>
      <td><span class="badge text-bg-light border">{{ task.priority }}</span></td>
      <td class="text-end">
        <a [routerLink]="['/task-form', task.id]" class="btn btn-sm btn-outline-primary me-1">Edit</a>
        <button class="btn btn-sm btn-outline-danger" (click)="onDelete(task.id)">Delete</button>
      </td>
    </tr>
    } @empty {
    <tr>
      <td colspan="4" class="text-center text-muted py-4">No tasks yet.</td>
    </tr>
    }
    </tbody>
  </table>
</div>
